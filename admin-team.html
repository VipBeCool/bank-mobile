<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>团队管理 - 智能营销平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 团队管理页专属样式 */

        .team-header {
            padding: max(16px, env(safe-area-inset-top)) 16px 16px;
            background: var(--surface);
        }
        .team-header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .team-header-sub {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        /* 面包屑导航 */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--gray-500);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .breadcrumb-item {
            color: var(--brand-primary);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .breadcrumb-item:last-child {
            color: var(--gray-700);
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb-sep {
            color: var(--gray-300);
            font-size: 11px;
        }

        /* 汇总条 */
        .summary-bar {
            display: flex;
            gap: 0;
            margin: 0 16px 16px;
            background: var(--surface);
            border-radius: var(--r-md);
            border: 1px solid var(--gray-100);
            overflow: hidden;
        }
        .summary-item {
            flex: 1;
            padding: 14px 12px;
            text-align: center;
            border-right: 1px solid var(--gray-100);
        }
        .summary-item:last-child {
            border-right: none;
        }
        .summary-item-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .summary-item-label {
            font-size: 11px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        /* 成员卡片 */
        .member-card {
            background: var(--surface);
            border-radius: var(--r-md);
            padding: 16px;
            margin: 0 16px 10px;
            border: 1px solid var(--gray-100);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .member-card:active {
            transform: scale(0.98);
            background: var(--gray-50);
        }
        .member-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .member-card-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .member-card-avatar--blue {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }
        .member-card-avatar--green {
            background: linear-gradient(135deg, #059669, #10b981);
        }
        .member-card-avatar--purple {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }
        .member-card-avatar--orange {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }
        .member-card-info {
            flex: 1;
            min-width: 0;
        }
        .member-card-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .member-card-role {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 2px;
        }
        .member-card-rate {
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: var(--r-pill);
            flex-shrink: 0;
        }
        .member-card-rate--high {
            background: var(--success-bg);
            color: var(--success);
        }
        .member-card-rate--mid {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .member-card-rate--low {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* 指标网格 */
        .member-card-metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            background: var(--gray-50);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .member-metric {
            padding: 10px 8px;
            text-align: center;
            border-right: 1px solid var(--gray-100);
        }
        .member-metric:last-child {
            border-right: none;
        }
        .member-metric-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-800);
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .member-metric-label {
            font-size: 10px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        /* 操作按钮行 */
        .member-card-actions {
            display: flex;
            gap: 8px;
        }
        .member-card-btn {
            flex: 1;
            height: 36px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .member-card-btn--outline {
            background: var(--surface);
            border: 1px solid var(--gray-200);
            color: var(--gray-700);
        }
        .member-card-btn--outline:active {
            background: var(--gray-50);
        }
        .member-card-btn--primary {
            background: var(--brand-primary);
            border: none;
            color: #fff;
        }
        .member-card-btn--primary:active {
            opacity: 0.9;
        }
    </style>
</head>

<body>
<div class="page">

    <!-- 顶部 -->
    <div class="team-header">
        <div class="team-header-title">团队管理</div>
        <div class="team-header-sub" id="headerSub">平安银行苏州市分行 · 下辖 3 个区县支行 · 19 名客户经理</div>
    </div>

    <!-- 面包屑 -->
    <div class="breadcrumb" id="breadcrumb">
        <span class="breadcrumb-item" onclick="location.href='admin-dashboard.html'">平安银行苏州市分行</span>
    </div>

    <!-- 汇总条 -->
    <div class="summary-bar">
        <div class="summary-item">
            <div class="summary-item-value">19</div>
            <div class="summary-item-label">客户经理</div>
        </div>
        <div class="summary-item">
            <div class="summary-item-value">3,856</div>
            <div class="summary-item-label">总客户</div>
        </div>
        <div class="summary-item">
            <div class="summary-item-value">72%</div>
            <div class="summary-item-label">触达率</div>
        </div>
        <div class="summary-item">
            <div class="summary-item-value">2,760<span style="font-size: 11px; font-weight: 500; color: var(--gray-500);">万</span></div>
            <div class="summary-item-label">本月放款</div>
        </div>
    </div>

    <!-- 成员列表 -->
    <div class="section-hd" style="margin-top: 0;">
        <div class="section-title" id="listTitle">下属客户经理</div>
        <div style="font-size: 13px; color: var(--gray-400);">按触达率排序</div>
    </div>

    <div id="teamList">
        <!-- 动态渲染 -->
    </div>

    <div class="no-more">没有更多了~</div>
</div>

    <!-- 底部 Tab 栏（管理员版） -->
    <nav class="tab-bar">
        <div class="tab-bar-inner">
            <a href="admin-dashboard.html" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10"/>
                    <path d="M12 20V4"/>
                    <path d="M6 20v-6"/>
                </svg>
                <span>总览</span>
            </a>
            <a href="customers.html" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                    <path d="M16 3.13a4 4 0 010 7.75"/>
                </svg>
                <span>名单</span>
            </a>
            <a href="admin-team.html" class="tab-item on">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" y1="8" x2="19" y2="14"/>
                    <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
                <span>团队</span>
            </a>
        </div>
    </nav>

<!-- 小程序环境检测 -->
<script>
(function() {
    function detect() {
        var ua = navigator.userAgent.toLowerCase();
        var isMiniProgram = ua.indexOf('miniprogram') > -1
            || window.__wxjs_environment === 'miniprogram';
        if (isMiniProgram) {
            document.documentElement.classList.add('in-miniprogram');
        }
    }
    detect();
    document.addEventListener('WeixinJSBridgeReady', detect);
})();
</script>
<script src="js/role-manager.js"></script>
<script>
(function() {
    var profile = RoleManager.getProfile();
    var subs = RoleManager.getSubordinates();
    
    // 更新头部和面包屑
    document.getElementById('headerSub').textContent = profile.orgName + ' · 下属 ' + subs.length + ' 个单位/成员';
    document.getElementById('breadcrumb').innerHTML = '<span class="breadcrumb-item">' + profile.orgName + '</span>';
    document.getElementById('listTitle').textContent = '下属成员 (' + subs.length + ')';
    
    var listHtml = '';
    if (!subs || subs.length === 0) {
        listHtml = '<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:40px 20px;">暂无下属成员</div>';
    } else {
        var avatars = ['blue', 'green', 'purple', 'orange'];
        
        subs.forEach(function(sub, index) {
            var isManager = sub.type === 'manager';
            var isTeam = sub.type === 'team';
            
            // 随机数据模拟
            var rate = Math.floor(Math.random() * 40 + 50); // 50-90
            var rateClass = rate >= 80 ? 'member-card-rate--high' : (rate >= 60 ? 'member-card-rate--mid' : 'member-card-rate--low');
            var custCount = isManager ? Math.floor(Math.random() * 100 + 50) : Math.floor(Math.random() * 800 + 200);
            var pending = isManager ? Math.floor(Math.random() * 30 + 5) : Math.floor(Math.random() * 100 + 20);
            var following = isManager ? Math.floor(Math.random() * 40 + 10) : Math.floor(Math.random() * 150 + 50);
            var loan = isManager ? Math.floor(Math.random() * 100 + 20) : Math.floor(Math.random() * 400 + 100);
            
            var avatarColor = avatars[index % avatars.length];
            var avatarChar = sub.name.charAt(0);
            
            var roleText = profile.orgName + ' · ' + (isManager ? '客户经理' : (isTeam ? '营销团队' : '下级机构'));
            
            listHtml += '<div class="member-card">' +
                '<div class="member-card-header">' +
                    '<div class="member-card-avatar member-card-avatar--' + avatarColor + '">' + avatarChar + '</div>' +
                    '<div class="member-card-info">' +
                        '<div class="member-card-name">' + sub.name + '</div>' +
                        '<div class="member-card-role">' + roleText + '</div>' +
                    '</div>' +
                    '<div class="member-card-rate ' + rateClass + '">' + rate + '%</div>' +
                '</div>' +
                '<div class="member-card-metrics">' +
                    '<div class="member-metric">' +
                        '<div class="member-metric-value">' + custCount + '</div>' +
                        '<div class="member-metric-label">总客户</div>' +
                    '</div>' +
                    '<div class="member-metric">' +
                        '<div class="member-metric-value">' + pending + '</div>' +
                        '<div class="member-metric-label">待触达</div>' +
                    '</div>' +
                    '<div class="member-metric">' +
                        '<div class="member-metric-value">' + following + '</div>' +
                        '<div class="member-metric-label">跟进中</div>' +
                    '</div>' +
                    '<div class="member-metric">' +
                        '<div class="member-metric-value">' + loan + '<span style="font-size: 10px;">万</span></div>' +
                        '<div class="member-metric-label">本月放款</div>' +
                    '</div>' +
                '</div>' +
                '<div class="member-card-actions">' +
                    '<div class="member-card-btn member-card-btn--outline" onclick="location.href=\'customers.html' + (isManager ? '?manager=' + sub.id : '') + '\'">' +
                        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
                        ' 查看名单' +
                    '</div>' +
                    '<div class="member-card-btn member-card-btn--primary" onclick="location.href=\'customers.html?scope=pending' + (isManager ? '&target=' + sub.id : '') + '\'">' +
                        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
                        ' 分配资源' +
                    '</div>' +
                '</div>' +
            '</div>';
        });
    }
    
    document.getElementById('teamList').innerHTML = listHtml;
})();
</script>
<script src="js/design-mode.js"></script>
</body>
</html>
