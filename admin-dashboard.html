<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>营销平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 管理员看板专属样式 */

        /* 最新跟进 — 流式卡片 */
        .activity-item {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border-left: 4px solid transparent;
        }
        .activity-top {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .activity-item--intent  { border-left-color: #10b981; }
        .activity-item--touched { border-left-color: #3b82f6; }
        .activity-item--follow  { border-left-color: #f59e0b; }
        
        .activity-icon-wrap {
            width: 38px;
            height: 38px;
            background: #eff6ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-primary);
            flex-shrink: 0;
            margin-top: 2px;
        }
        .activity-body { flex: 1; min-width: 0; padding-bottom: 2px; }
        .activity-enterprise {
            font-size: 14px; font-weight: 700; color: var(--gray-900);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; min-width: 0;
        }
        .activity-uscc {
            font-size: 11px; color: var(--gray-400); font-family: 'SF Pro Display', monospace;
            margin-bottom: 4px;
        }
        .activity-desc {
            font-size: 12px; color: var(--gray-500); margin-top: 4px;
            line-height: 1.5;
        }
        .activity-desc strong { color: var(--gray-700); font-weight: 600; }
        .activity-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--gray-200);
        }
        .activity-badge {
            font-size: 12px; font-weight: 600; 
            display: flex; align-items: center; gap: 6px;
        }
        .activity-badge::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
        }
        .activity-badge--intent { color: #ef4444; }
        .activity-badge--intent::before { background: #ef4444; }
        
        .activity-badge--touched { color: #3b82f6; }
        .activity-badge--touched::before { background: #3b82f6; }
        
        .activity-badge--follow { color: #f59e0b; }
        .activity-badge--follow::before { background: #f59e0b; }

        .activity-time {
            font-size: 11px; color: var(--gray-400); 
            display: flex; align-items: center; gap: 4px;
        }

        /* 待分配提醒条 */
        .pending-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: var(--r-md);
            padding: 12px 16px;
            margin: 0 16px 16px;
            cursor: pointer;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .pending-banner:active {
            transform: scale(0.98);
        }
        .pending-banner-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pending-banner-text {
            flex: 1;
            min-width: 0;
        }
        .pending-banner-title {
            font-size: 14px;
            font-weight: 700;
            color: #92400e;
        }
        .pending-banner-desc {
            font-size: 12px;
            color: #a16207;
            margin-top: 2px;
        }
        .pending-banner-arrow {
            color: #d97706;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="page">

    <!-- 顶部 Header -->
    <header class="header" style="padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 20px;">
        <div class="header-row">
            <div>
                <div style="font-size: 13px; color: var(--gray-500); margin-bottom: 4px; font-weight: 500;" id="greeting">下午好</div>
                <div class="header-title">工作台</div>
            </div>
            <div class="header-avatar" style="width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer;" onclick="location.href='entry.html'" title="切换角色" id="avatar">李</div>
        </div>
    </header>

    <!-- 汇总指标卡片区 -->
    <div class="metrics">
        <!-- 大卡片：客户总数 -->
        <div class="metric-card" onclick="location.href='customers.html'" style="cursor: pointer; grid-column: span 2; background: var(--brand-primary); color: #fff; overflow: hidden; padding: 24px 20px; border: none; box-shadow: 0 8px 20px rgba(37,99,235,0.2);">
            <!-- 装饰 -->
            <div style="position: absolute; right: 20px; top: -20px; bottom: -20px; width: 60px; background: rgba(255,255,255,0.08); transform: skewX(-25deg);"></div>
            <div style="position: absolute; right: 90px; top: -20px; bottom: -20px; width: 20px; background: rgba(255,255,255,0.12); transform: skewX(-25deg);"></div>
            <div style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); font-size: 24px; font-weight: bold; opacity: 0.9;">›</div>

            <div class="metric-label" style="color: rgba(255,255,255,0.9); font-size: 13px;">客户总数</div>
            <div class="metric-value" style="color: #fff; font-size: 40px; margin: 8px 0 16px;">3,856</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-right: 24px;">
                <div class="metric-trend" style="background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 12px; padding: 4px 8px; margin-top: 0;">
                    待触达 <span style="font-family: 'SF Mono', monospace; font-weight: 700;">468</span> 家
                </div>
                <div style="color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 500;">
                    待分配 <span style="font-size: 13px; font-family: 'SF Mono', monospace; font-weight: 700; color: #fff;">126</span>
                </div>
            </div>
        </div>

        <!-- 小卡片：本周触达 -->
        <div class="metric-card" style="padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: none; background: #fff;">
            <div class="metric-label">本周触达</div>
            <div class="metric-value" style="font-size: 26px; margin: 4px 0 0;">72<span style="font-size: 12px; font-weight: 500; color: var(--gray-500); margin-left: 2px;">家</span></div>
        </div>

        <!-- 小卡片：本周意向 -->
        <div class="metric-card" style="padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: none; background: #fff;">
            <div class="metric-label">本周意向</div>
            <div class="metric-value" style="font-size: 26px; margin: 4px 0 0;">89</div>
        </div>

        <!-- 小卡片：本月授信 -->
        <div class="metric-card" style="padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: none; background: #fff;">
            <div class="metric-label">本月授信</div>
            <div class="metric-value" style="font-size: 26px; margin: 4px 0 0;">5,280<span style="font-size: 12px; font-weight: 500; color: var(--gray-500); margin-left: 2px;">万</span></div>
        </div>

        <!-- 小卡片：本月放款 -->
        <div class="metric-card" style="padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: none; background: #fff;">
            <div class="metric-label">本月放款</div>
            <div class="metric-value" style="font-size: 26px; margin: 4px 0 0;">2,760<span style="font-size: 12px; font-weight: 500; color: var(--gray-500); margin-left: 2px;">万</span></div>
        </div>
    </div>

    <!-- 待分配提醒 -->
    <div class="pending-banner" onclick="location.href='customers.html?scope=pending'">
        <div class="pending-banner-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <div class="pending-banner-text">
            <div class="pending-banner-title">126 家企业待分配</div>
            <div class="pending-banner-desc">新一批名单已到，请尽快分配给客户经理</div>
        </div>
        <div class="pending-banner-arrow">›</div>
    </div>

    <!-- 团队动态 -->
    <div class="section-hd" style="margin-top: 0;">
        <div class="section-title">最新跟进</div>
        <div class="section-action" onclick="location.href='admin-team.html'" style="font-size: 13px;">查看全部</div>
    </div>

    <div class="card-list" id="subordinatesList">
        <!-- JS 动态渲染 -->
    </div>

    <div class="no-more">没有更多了~</div>
</div>

    <!-- 底部 Tab 栏（管理员版） -->
    <nav class="tab-bar">
        <div class="tab-bar-inner">
            <a href="admin-dashboard.html" class="tab-item on">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10"/>
                    <path d="M12 20V4"/>
                    <path d="M6 20v-6"/>
                </svg>
                <span>总览</span>
            </a>
            <a href="customers.html" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                    <path d="M16 3.13a4 4 0 010 7.75"/>
                </svg>
                <span>名单</span>
            </a>
            <a href="admin-team.html" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" y1="8" x2="19" y2="14"/>
                    <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
                <span>团队</span>
            </a>
        </div>
    </nav>

<!-- 小程序环境检测 -->
<script>
(function() {
    function detect() {
        var ua = navigator.userAgent.toLowerCase();
        var isMiniProgram = ua.indexOf('miniprogram') > -1
            || window.__wxjs_environment === 'miniprogram';
        if (isMiniProgram) {
            document.documentElement.classList.add('in-miniprogram');
        }
    }
    detect();
    document.addEventListener('WeixinJSBridgeReady', detect);
})();
</script>

<!-- 动态内容：根据角色信息更新页面 -->
<script src="js/role-manager.js"></script>
<script>
(function () {
    var profile = RoleManager.getProfile();

    // 更新问候语
    var hour = new Date().getHours();
    var greetText = hour < 12 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
    document.getElementById('greeting').textContent = greetText;

    // 更新用户信息
    if (document.getElementById('userName')) {
        document.getElementById('userName').textContent = profile.userName;
    }
    if (document.getElementById('orgName')) {
        document.getElementById('orgName').textContent = profile.orgName;
    }
    if (document.getElementById('avatar')) {
        document.getElementById('avatar').textContent = profile.avatar;
    }

    // 最新跟进动态流（以企业为维度）
    var activities = [
        { enterprise: '苏州科技有限公司', uscc: '91320500MA1TXXXXX1', rm: '王芳', team: '苏州分行', action: '完成首次触达', type: 'touched', time: '刚刚' },
        { enterprise: '南京制造集团',     uscc: '91320100MA2PXXXXX2', rm: '李明', team: '南京分行', action: '确认意向',     type: 'intent',  time: '1小时前' },
        { enterprise: '无锡纶织股份公司', uscc: '91320200MA3QXXXXX3', rm: '张伟', team: '苏州分行', action: '完成首次触达', type: 'touched', time: '今天 10:30' },
        { enterprise: '常州建材有限公司', uscc: '91320400MA4RXXXXX4', rm: '赵静', team: '常州分行', action: '确认意向',     type: 'intent',  time: '昨天' },
        { enterprise: '镇江食品加工厂',   uscc: '91321100MA5SXXXXX5', rm: '陈浩', team: '镇江分行', action: '再次跟进',     type: 'follow',  time: '昨天' },
        { enterprise: '扬州商贸公司',     uscc: '91321000MA6TXXXXX6', rm: '刘洋', team: '南京分行', action: '确认意向',     type: 'intent',  time: '2天前' },
    ];

    var listHtml = activities.map(function(a) {
        var badgeClass = 'activity-badge--' + a.type;
        var itemClass  = 'activity-item--'  + a.type;
        var badgeText  = a.type === 'intent' ? '确认意向' : (a.type === 'follow' ? '再次跟进' : '已触达');
        
        var iconSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18"></path><path d="M6 12H4a2 2 0 0 0-2 2v8"></path><path d="M18 16h2a2 2 0 0 1 2 2v4"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>';
        
        var timeIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
        
        return '<div class="activity-item ' + itemClass + '">'
            + '<div class="activity-top">'
                + '<div class="activity-icon-wrap">' + iconSvg + '</div>'
                + '<div class="activity-body">'
                    + '<div class="activity-enterprise">' + a.enterprise + '</div>'
                    + '<div class="activity-uscc">' + a.uscc + '</div>'
                    + '<div class="activity-desc"><strong>' + a.rm + '</strong>（' + a.team + '）' + a.action + '</div>'
                + '</div>'
            + '</div>'
            + '<div class="activity-footer">'
                + '<div class="activity-badge ' + badgeClass + '">' + badgeText + '</div>'
                + '<div class="activity-time">' + timeIcon + a.time + '</div>'
            + '</div>'
        + '</div>';
    }).join('');

    document.getElementById('subordinatesList').innerHTML = listHtml;
})();
</script>

<!-- 设计模式 -->
<script src="js/design-mode.js"></script>

</body>
</html>
